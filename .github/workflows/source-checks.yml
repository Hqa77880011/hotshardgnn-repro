name: Source checks
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m compileall -q src scripts reproduce.py
      - name: Check configuration syntax
        run: python -c "import json; from pathlib import Path; [json.loads(path.read_text(encoding='utf-8')) for path in Path('configs').glob('*.json')]"
      - name: Check CLI help
        run: |
          python -m hotshardgnn.data --help
          python -m hotshardgnn.train --help
          python -m hotshardgnn.report --help
          python scripts/launch_cpu.py --help
          python reproduce.py --plan
